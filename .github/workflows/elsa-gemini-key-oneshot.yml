name: Elsa Gemini Key (one-shot)

on:
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update env, recreate, listModels once, probe until first OK
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          TEMP_GEMINI_API_KEY: ${{ secrets.TEMP_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          B64KEY=$(printf '%s' "$TEMP_GEMINI_API_KEY" | base64 -w0)
          SCRIPT_B64=''
          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/remote-elsa.sh
          scp -P "$SSH_PORT" /tmp/remote-elsa.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/remote-elsa.sh"
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='$DEPLOY_PATH' B64KEY='$B64KEY' bash /tmp/remote-elsa.sh; rm -f /tmp/remote-elsa.sh"
