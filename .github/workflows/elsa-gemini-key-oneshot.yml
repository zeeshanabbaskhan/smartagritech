name: Elsa Gemini Key (one-shot)

on:
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update env, recreate, listModels once, probe until first OK
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          TEMP_GEMINI_API_KEY: ${{ secrets.TEMP_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          B64KEY=$(printf '%s' "$TEMP_GEMINI_API_KEY" | base64 -w0)
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='$DEPLOY_PATH' B64KEY='$B64KEY' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          NEW_KEY=$(printf '%s' "$B64KEY" | base64 -d)
          export NEW_KEY DEPLOY_PATH

          python3 - <<'PY'
          import os, re
          path = os.path.join(os.environ["DEPLOY_PATH"], ".env")
          key = os.environ["NEW_KEY"]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              txt = f.read()
          def upsert(txt, name, val):
              pat = re.compile(rf'(?m)^{re.escape(name)}=.*$')
              line = f"{name}={val}"
              if pat.search(txt):
                  return pat.sub(line, txt)
              if not txt.endswith("\n"):
                  txt += "\n"
              return txt + line + "\n"
          txt = upsert(txt, "GEMINI_API_KEY", key)
          txt = upsert(txt, "AI_PROVIDER", "gemini")
          with open(path, "w", encoding="utf-8") as f:
              f.write(txt)
          print(f"ENV_UPDATED KEYLEN={len(key)} PREFIX={key[:3]}")
          PY

          docker compose up -d --force-recreate --no-deps backend
          sleep 10
          docker compose exec -T backend sh -lc 'K="$GEMINI_API_KEY"; echo "KEYLEN=${#K} PREFIX=${K:0:3} PROVIDER=$AI_PROVIDER MODEL=$GEMINI_MODEL"'

          KEY="$NEW_KEY"
          echo "=== LISTMODELS (once) ==="
          LM_CODE=$(curl -sS -o /tmp/lm.json -w "%{http_code}" -H "x-goog-api-key: ${KEY}" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100")
          echo "LISTMODELS_HTTP=$LM_CODE"
          python3 - <<'PY'
          import json
          try:
            data=json.load(open("/tmp/lm.json"))
          except Exception as e:
            print("LIST_PARSE_FAIL", e)
            open("/tmp/gemini_models.txt","w").write("")
            raise SystemExit(0)
          if "error" in data:
            err=data["error"]
            print("LIST_ERROR", err.get("status"), (err.get("message") or "")[:200])
            open("/tmp/gemini_models.txt","w").write("")
            raise SystemExit(0)
          names=[]
          for m in data.get("models",[]):
            n=m.get("name","").replace("models/","")
            methods=m.get("supportedGenerationMethods") or []
            if "generateContent" in methods:
              names.append(n)
          print("GENERATE_CONTENT_MODELS:")
          for n in names:
            print(" -", n)
          open("/tmp/gemini_models.txt","w").write("\n".join(names))
          PY

          CANDIDATES="gemini-2.0-flash-lite gemini-2.0-flash gemini-2.5-flash-lite gemini-2.5-flash gemini-flash-lite-latest gemini-flash-latest"
          WORKING=""
          echo "=== PROBE generateContent (stop at first success) ==="
          for m in $CANDIDATES; do
            if [ -s /tmp/gemini_models.txt ]; then
              if ! grep -E -q "^${m}($|-)" /tmp/gemini_models.txt; then
                echo "SKIP_NOT_LISTED model=$m"
                continue
              fi
            fi
            CODE=$(curl -sS -o /tmp/gc.json -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${KEY}" \
              -d '{"contents":[{"parts":[{"text":"Reply with OK only."}]}],"generationConfig":{"maxOutputTokens":8}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent")
            SNIP=$(python3 -c 'import json
d=json.load(open("/tmp/gc.json"))
err=d.get("error")
if err:
 print("%s:%s" % (err.get("status"), (err.get("message") or "")[:120]))
else:
 t=((d.get("candidates") or [{}])[0].get("content") or {}).get("parts") or [{}]
 print((t[0].get("text") or "")[:80])')
            echo "PROBE model=$m http=$CODE snip=$SNIP"
            if [ "$CODE" = "200" ]; then
              WORKING="$m"
              break
            fi
          done

          if [ -z "$WORKING" ]; then
            echo "NO_WORKING_MODEL"
            exit 0
          fi

          echo "WORKING_MODEL=$WORKING"
          export WORKING
          python3 - <<'PY'
          import os, re
          path = os.path.join(os.environ["DEPLOY_PATH"], ".env")
          model = os.environ["WORKING"]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              txt = f.read()
          pat = re.compile(r'(?m)^GEMINI_MODEL=.*$')
          line = f"GEMINI_MODEL={model}"
          if pat.search(txt):
              txt = pat.sub(line, txt)
          else:
              if not txt.endswith("\n"):
                  txt += "\n"
              txt += line + "\n"
          with open(path, "w", encoding="utf-8") as f:
              f.write(txt)
          print("GEMINI_MODEL_SET", model)
          PY

          docker compose up -d --force-recreate --no-deps backend
          sleep 10
          docker compose exec -T backend sh -lc 'K="$GEMINI_API_KEY"; echo "FINAL KEYLEN=${#K} PREFIX=${K:0:3} PROVIDER=$AI_PROVIDER MODEL=$GEMINI_MODEL"'
          REMOTE