name: Tail Backend Logs (one-shot)
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOS
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose logs --tail=100 backend 2>&1 | grep -iE 'chatbot|gemini|GoogleGenerative|429|404|403|quota|MODEL|not found|API key|RESOURCE|PERMISSION|error detail' || true
          echo '---LAST40---'
          docker compose logs --tail=40 backend
          EOS