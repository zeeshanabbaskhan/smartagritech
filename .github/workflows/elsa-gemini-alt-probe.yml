name: Elsa Gemini Alt Probe (one-shot)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Probe two alternate lite models
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SCRIPT_B64=''
          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/remote-elsa-alt.sh
          scp -P "$SSH_PORT" /tmp/remote-elsa-alt.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/remote-elsa-alt.sh"
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='$DEPLOY_PATH' bash /tmp/remote-elsa-alt.sh; rm -f /tmp/remote-elsa-alt.sh"
