name: Deploy Frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'web_frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Frontend to Linux Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web_frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: web_frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Server via SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          cd web_frontend/dist
          tar -czf /tmp/dist.tar.gz .

          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          [ -z "$DEPLOY_HOST" ] && DEPLOY_HOST="51.38.88.130"

          DEPLOY_PASS="${{ secrets.DEPLOY_PASS }}"
          [ -z "$DEPLOY_PASS" ] && DEPLOY_PASS="rovnank6Duk%"
          export SSHPASS="$DEPLOY_PASS"

          echo "Deploying to ${DEPLOY_HOST}..."
          sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 /tmp/dist.tar.gz dev-user@${DEPLOY_HOST}:/tmp/dist.tar.gz
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 dev-user@${DEPLOY_HOST} "
            rm -rf /tmp/new_html && mkdir -p /tmp/new_html &&
            tar -xzf /tmp/dist.tar.gz -C /tmp/new_html &&
            docker cp /tmp/new_html/. smartagritech-frontend-1:/usr/share/nginx/html/ &&
            docker exec smartagritech-frontend-1 nginx -s reload &&
            rm -f /tmp/dist.tar.gz && rm -rf /tmp/new_html
          "
          echo "Frontend successfully deployed to production!"
