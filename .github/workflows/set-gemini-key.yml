name: Set Gemini API Key (one-shot)

on:
  workflow_dispatch:

concurrency:
  group: set-gemini-key
  cancel-in-progress: false

jobs:
  set-key:
    name: Update GEMINI_API_KEY on server
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Patch server .env and restart backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          TEMP_GEMINI_API_KEY: ${{ secrets.TEMP_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Pass key via env on remote without printing it
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='$DEPLOY_PATH' NEW_KEY='$TEMP_GEMINI_API_KEY' bash -s" <<'EOS'
          set -euo pipefail
          ENV_FILE="${DEPLOY_PATH}/.env"
          test -f "$ENV_FILE"

          # Upsert GEMINI_API_KEY and force AI_PROVIDER=gemini
          python3 - <<'PY'
          import os
          path = os.environ["DEPLOY_PATH"] + "/.env"
          key = os.environ["NEW_KEY"]
          with open(path, "r", encoding="utf-8", errors="replace") as f:
              lines = f.read().splitlines()
          out = []
          seen_g = seen_p = False
          for line in lines:
              if line.startswith("GEMINI_API_KEY="):
                  out.append("GEMINI_API_KEY=" + key)
                  seen_g = True
              elif line.startswith("AI_PROVIDER="):
                  out.append("AI_PROVIDER=gemini")
                  seen_p = True
              else:
                  out.append(line)
          if not seen_g:
              out.append("GEMINI_API_KEY=" + key)
          if not seen_p:
              out.append("AI_PROVIDER=gemini")
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(out) + "\n")
          # Masked confirm
          v = key
          print("GEMINI_API_KEY set len=%d prefix=%s..." % (len(v), v[:3]))
          print("AI_PROVIDER=gemini")
          PY

          cd "$DEPLOY_PATH"
          # Restart backend so env reloads (compose reads .env)
          docker compose up -d --force-recreate --no-deps backend
          sleep 3
          docker compose ps backend || true
          # Confirm env inside container (length only)
          docker compose exec -T backend sh -c 'echo GEMINI_LEN=${#GEMINI_API_KEY}; echo AI_PROVIDER=$AI_PROVIDER; echo PREFIX=$(printf %s "$GEMINI_API_KEY" | cut -c1-3)'
          curl -fsS http://127.0.0.1:9001/health || curl -fsS http://127.0.0.1:${BACKEND_HOST_PORT:-9001}/health || true
          EOS
